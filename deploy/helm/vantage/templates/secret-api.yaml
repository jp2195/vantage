{{- include "vantage.requireAPITokens" . }}
{{- include "vantage.requireUniqueAPITokenNames" .Values.api.tokens }}
{{- if not .Values.api.existingSecret }}
{{- $secretName := printf "%s-api" (include "vantage.fullname" .) }}
{{- /* Generated tokens are reused across upgrades, keyed per token name
       because this Secret renders a list: adding a second token to
       api.tokens must not disturb the first one's already-issued value.
       Precedence per token:
         1. .token pinned in values -- used verbatim (the documented
            rotation path; must keep winning over the other two).
         2. else, the live Secret already has a key matching .name --
            reused via lookup + b64dec, so an upgrade that doesn't touch
            a given token doesn't hand its clients a new bearer value out
            from under them.
         3. else -- randAlphaNum 40.
       `lookup` returns an empty map with no cluster connection (helm
       template, --dry-run), which falls through to step 3 -- correct for
       a dry render. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels: {{- include "vantage.labels" . | nindent 4 }}
  annotations:
    # The lookup above, not this annotation, is what keeps an unpinned
    # token stable across upgrades: resource-policy: keep only suppresses
    # deletion on `helm uninstall` and has no effect on the 3-way-merge
    # patch Helm applies during `helm upgrade`. Kept anyway so an
    # uninstall doesn't remove tokens a client still holds.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- range .Values.api.tokens }}
  {{- $token := .token }}
  {{- if not $token }}
  {{- if and $existing (hasKey $existing.data .name) }}
  {{- $token = index $existing.data .name | b64dec }}
  {{- else }}
  {{- $token = randAlphaNum 40 }}
  {{- end }}
  {{- end }}
  {{ .name }}: {{ $token | quote }}
  {{- end }}
{{- end }}
