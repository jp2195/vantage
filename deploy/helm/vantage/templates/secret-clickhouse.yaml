{{- if not .Values.clickhouse.existingSecret }}
{{- /*
Credentials for the operator's OWN ClickHouse, carried into a Secret so the
daemons and the schema Job read them the same way whether they came from
values or from an existing Secret.

THIS TEMPLATE NO LONGER GENERATES A PASSWORD. It used to fall back to
randAlphaNum 24 -- reusing whatever the live Secret already held, so an
upgrade did not hand ClickHouse's persisted user table a password the Secret
no longer had. That was correct while the chart owned the database. It is
nonsense against a database it does not own: minting a random credential for
someone else's server produces a guaranteed authentication failure wearing
the costume of a working default, and the failure surfaces as a crash-looping
writer rather than as a render error naming the missing value.

So credentials are explicit now. Supply clickhouse.existingSecret, or
clickhouse.auth.password. Supplying neither is a render failure, the same
"turned it on, forgot the one thing it needed" guard vantage.requireAPITokens
and clickhouse.externalHost already apply.
*/}}
{{- $secretName := printf "%s-clickhouse" (include "vantage.fullname" .) }}
{{- $password := required "clickhouse.auth.password is required unless clickhouse.existingSecret is set: this chart does not deploy ClickHouse and cannot invent a credential for a database it does not own." .Values.clickhouse.auth.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels: {{- include "vantage.labels" . | nindent 4 }}
  annotations:
    # Kept so `helm uninstall` does not remove a credential the operator's
    # own database still expects. It has no effect on upgrade, which is the
    # 3-way-merge patch, and the password is no longer generated so there is
    # nothing here that has to survive a re-render to stay correct.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  username: {{ .Values.clickhouse.auth.username | quote }}
  password: {{ $password | quote }}
{{- end }}
