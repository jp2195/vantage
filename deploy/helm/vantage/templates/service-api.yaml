apiVersion: v1
kind: Service
metadata:
  name: {{ include "vantage.fullname" . }}-api
  labels:
    {{- include "vantage.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  selector:
    {{- include "vantage.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
    - name: metrics
      port: {{ .Values.api.metricsPort }}
      targetPort: metrics
