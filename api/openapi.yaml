# The vantage-api contract. Hand-written, and the source of truth: the
# implementation is tested against this file in both directions (no
# undocumented endpoint, no documented-but-unrouted path, and golden
# instances of every response schema validated against it). It is served
# by the daemon at /v1/openapi.yaml.
#
# Conventions this contract commits to, and why:
#
#   - Versioned paths, additive-only changes within /v1/ -- the same
#     discipline `buf breaking` enforces on the proto.
#   - All u64 identity fields (session_id, seq, stream_seq) are JSON
#     strings: session_id is a UnixNano timestamp (~1.77e18), past 2^53,
#     and a JSON number silently loses precision in JS-adjacent clients.
#   - origin_asn and label are nullable, never a defaulted 0. AS 0 and
#     label 0 are both real values (reserved AS; implicit-null label), so
#     0-as-absent reproduces a defect this project has already shipped and
#     fixed once (2026-08-23: a Grafana L3VPN panel reported 142 rows that
#     carried no AS path as originating in the reserved AS 0).
#   - IP addresses are always in plain form ("10.0.103.61", never
#     "::ffff:10.0.103.61") for every field the query layer returns as a
#     typed address -- router_ip, peer_ip, next_hop -- because query/ unmaps
#     each one on the way out of the scan loop.
#     EVPNRoute's `ip` and `gateway_ip` are the exception and are NOT
#     normalized: they are String columns carrying whatever text the decoder
#     wrote, and for a type-3 route they are "" rather than an address at
#     all, so there is nothing to unmap. No stored value is mapped today
#     (0 of 202 rows), and a caller comparing them to a next hop should
#     parse and unmap first. TRIGGER for normalizing them in query/: a
#     decoder or a vendor that emits the ::ffff: form for either column.
#   - A down peer contributes nothing, and a still-dumping session is
#     reported as such (dump_state, meta.warnings) -- an empty answer and
#     a partial answer are different facts and both are stated.
openapi: 3.1.0
info:
  title: vantage-api
  version: "1.0.0"
  description: >
    Question-shaped read API over vantage's BMP archive. Endpoints answer
    "where is this prefix right now", "what is this peer carrying", "what
    changed" -- each one session-scoped current state derived from the
    append-only event log, never raw table access. Current state means: per
    (collector, router), the newest BMP session; within it, each route key's
    newest observation by (seq, stream_seq), excluding withdrawals; a down
    peer contributes nothing.

servers:
  - url: /

security:
  - bearerAuth: []

tags:
  - name: inventory
  - name: routes
  - name: rib
  - name: link-state
  - name: events
  - name: collection
  - name: reference
  - name: meta

paths:
  /v1/routers:
    get:
      tags: [inventory]
      operationId: listRouters
      summary: Router inventory with current-session peer counts.
      responses:
        "200":
          description: One entry per (collector, router).
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Router" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/collectors:
    get:
      tags: [inventory]
      operationId: listCollectors
      summary: The archive's own view of each collector, beside what that collector's process currently says about itself.
      responses:
        "200":
          description: >
            One row per collector id: the UNION of every id query.Collectors
            has an archive record for and every id this daemon is
            configured to poll at /status. Either side alone is a different
            wrong answer -- config alone cannot see a collector that has
            been decommissioned but whose data is still being read, and the
            archive alone cannot see a collector that is configured and
            completely down -- so a row can be present on one side and
            absent on the other, and that absence is itself part of the
            answer.

            archive is null when the archive has no record of this id at
            all. It is never a real object with zero routers and zero peers:
            that shape cannot occur, because an id the archive has ANY
            record of always has at least one router. A non-null archive
            carries this collector's current routers, its peers rolled up
            into fleet totals, and last_row_at -- the newest row this
            collector has written to ANY of the archive's ten data tables,
            not merely a peer up/down event, so a collector that is busy
            writing route or link-state updates is not misread as dead just
            because its BGP sessions have had nothing new to report.

            status is null whenever the daemon did not answer, for either of
            two reasons this response keeps distinguishable rather than
            collapsing into one blank card: no endpoint is configured for
            this id at all (reachable is then ALSO null -- reachability is
            not a question to ask of a collector nobody told this daemon how
            to reach), or one IS configured and it did not respond
            (reachable is then false, and error names why: unreachable,
            timed out, a non-200 response, or a body that did not decode).
            status is non-null, and reachable true, only when the daemon
            actually answered. A collector with no endpoint has NO uptime
            and NO message count -- not zero of each, which would read as a
            collector that has been up for no time and has processed
            nothing, the description of a broken one rather than an
            unconfigured one.

            THERE IS NO LAG FIELD ANYWHERE ON THIS RESPONSE, and there must
            never be one: vantage_sink_consumer_lag is the WRITER's, per
            stream, measured in envelopes, and one writer consumes every
            stream on behalf of every collector it serves -- there is no
            per-collector lag this daemon could honestly attribute to the
            process status describes.

            id_mismatch carries the CONFIGURED id, and only when the daemon
            answered under a DIFFERENT collector_id than the id it is
            configured under -- someone pointed this entry's endpoint at
            another collector's process. The row is keyed on the daemon's
            own (authoritative) id in that case, and the disagreement is
            stated rather than resolved to either side.

            activity is rows ARCHIVED PER MINUTE, oldest first, over
            meta.activity_window -- never a message count and never a rate:
            one BMP route-monitoring message carrying forty NLRIs archives
            as forty rows. Its length always equals meta.activity_window in
            minutes, including for a collector that archived nothing
            anywhere in the window: every entry for it reads zero rather
            than the array being shorter or the row being dropped, because a
            quiet collector is exactly the one an operator opens this screen
            to find. THE LAST ENTRY IS THE CURRENT, STILL-ACCUMULATING
            MINUTE, not the last fully-elapsed one -- a client that reads it
            as a completed minute renders a bar that is always short.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Collector" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/peers:
    get:
      tags: [inventory]
      operationId: listPeers
      summary: Per-(router, peer, rib) state as of the current session.
      parameters:
        - $ref: "#/components/parameters/router"
        - $ref: "#/components/parameters/rib"
      responses:
        "200":
          description: >
            One entry per (collector, router, peer, rib). state is the state
            the current session ended in -- a peer that flapped and recovered
            within it reports up. routes is the deduplicated live route-key
            count (0 for a down peer).
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Peer" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/routes:
    get:
      tags: [routes]
      operationId: findRoutes
      summary: Fleet-wide answer for one prefix or address, across all families.
      description: >
        The looking-glass fan-out: at least one of prefix= (exact match),
        covers= (longest-match containment; documented scan cost, measured
        31-52ms over 3.2M rows), origin_asn=, through_asn= or community= is
        required. prefix= and covers= remain mutually exclusive with each
        other -- together they ask for an exact prefix that also contains an
        address -- but any other combination of the five is a legal,
        narrower question. Returns a keyed object of homogeneous per-family
        arrays -- never a mixed array -- so each family keeps an exact
        schema. Each family's array is independently capped at the daemon's
        max_page; meta.total_matched is the sum of true matches across all
        three, and can exceed what was returned.
      parameters:
        - $ref: "#/components/parameters/prefix"
        - $ref: "#/components/parameters/covers"
        - $ref: "#/components/parameters/router"
        - $ref: "#/components/parameters/peer"
        - $ref: "#/components/parameters/rib"
        - $ref: "#/components/parameters/originASN"
        - $ref: "#/components/parameters/throughASN"
        - $ref: "#/components/parameters/community"
      responses:
        "200":
          description: Current state per family for the requested target.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/RouteFanout" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/routes/unicast:
    get:
      tags: [routes]
      operationId: findUnicastRoutes
      summary: Current unicast routes for one prefix or covering an address.
      parameters:
        - $ref: "#/components/parameters/prefix"
        - $ref: "#/components/parameters/covers"
        - $ref: "#/components/parameters/router"
        - $ref: "#/components/parameters/peer"
        - $ref: "#/components/parameters/rib"
        - name: family
          in: query
          description: >
            ipv6u is contractually legal but the archive currently holds zero
            IPv6 rows; expect empty results until a deployment's archive
            carries IPv6.
          schema: { type: string, enum: [ipv4u, ipv6u] }
        - $ref: "#/components/parameters/originASN"
        - $ref: "#/components/parameters/throughASN"
        - $ref: "#/components/parameters/community"
      responses:
        "200":
          description: >
            At least one of prefix=, covers=, origin_asn=, through_asn= or
            community= is required (prefix= and covers= stay mutually
            exclusive with each other -- see /v1/routes' own description).
            Capped at the daemon's max_page; meta.total_matched carries the
            true count and can exceed what was returned.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/UnicastRoute" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/routes/vpn:
    get:
      tags: [routes]
      operationId: findVPNRoutes
      summary: Current VPN and labeled-unicast routes.
      description: >
        Serves route_vpn as it exists: vpn4/vpn6 (RD, route targets) and lu4
        (BGP-LU; rd is "" and route_targets empty by nature, not by absence
        of data). family= distinguishes them without inferring from an empty
        rd. At least one of prefix=, rd=, router=, origin_asn=, through_asn=
        or community= is required -- the same rule as /v1/routes/evpn (an
        unfiltered dump belongs to /v1/rib/vpn). peer=, rib= and family=
        narrow but do not count toward this rule on their own: none of them
        bounds a fleet-wide answer to something a single unpaginated
        response can carry. A seventh narrowing shape, containment, is not a
        parameter on this path at all: covers= reaches the same underlying
        filter only through the /v1/routes fan-out, which is the only way to
        narrow a VPN answer by address containment here.

        Capped at the daemon's max_page; meta.total_matched carries the true
        count and can exceed what was returned.
      parameters:
        - name: prefix
          in: query
          schema: { type: string }
          example: "10.77.0.0/24"
        - name: rd
          in: query
          description: Exact route-distinguisher match, e.g. "65000:1".
          schema: { type: string }
        - name: family
          in: query
          schema: { type: string, enum: [vpn4, vpn6, lu4] }
        - $ref: "#/components/parameters/router"
        - $ref: "#/components/parameters/peer"
        - $ref: "#/components/parameters/rib"
        - $ref: "#/components/parameters/originASN"
        - $ref: "#/components/parameters/throughASN"
        - $ref: "#/components/parameters/community"
      responses:
        "200":
          description: Current state, one entry per live route key.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/VPNRoute" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/routes/evpn:
    get:
      tags: [routes]
      operationId: findEVPNRoutes
      summary: Current EVPN routes.
      description: >
        At least one of prefix=, rd=, router=, origin_asn=, through_asn= or
        community= is required (an unfiltered EVPN dump belongs to
        /v1/rib/evpn). peer=, rib= and type= narrow but do not count toward
        this rule on their own. As on /v1/routes/vpn, a seventh narrowing
        shape -- containment -- is not a parameter here: covers= reaches the
        same underlying filter only through the /v1/routes fan-out.

        Capped at the daemon's max_page; meta.total_matched carries the true
        count and can exceed what was returned.
      parameters:
        - name: prefix
          in: query
          description: Exact match on the IP prefix of type 5 (and type 2 where present) routes.
          schema: { type: string }
        - name: rd
          in: query
          schema: { type: string }
        - name: type
          in: query
          description: >
            EVPN route type: 1 Ethernet A-D, 2 MAC/IP, 3 IMET, 4 ES, 5 IP
            prefix. The bound is IANA's EVPN Route Types registry, which runs
            to 11, and not the five RFC 7432 and RFC 9136 define: the decoder
            sets route_type from the wire for every type, so a route of type
            6-11 can be STORED and RETURNED, and a narrower bound here would
            refuse the query that finds it while the response carrying it
            violated this schema.

            Only 2, 3 and 5 occur in the archive, so the name mappings above
            are the only ones any data has exercised; 6-11 are legal to ask
            for and untested in practice.
          schema: { type: integer, minimum: 1, maximum: 11 }
        - $ref: "#/components/parameters/router"
        - $ref: "#/components/parameters/peer"
        - $ref: "#/components/parameters/rib"
        - $ref: "#/components/parameters/originASN"
        - $ref: "#/components/parameters/throughASN"
        - $ref: "#/components/parameters/community"
      responses:
        "200":
          description: Current state, one entry per live EVPN NLRI.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/EVPNRoute" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/routes/history:
    get:
      tags: [routes]
      operationId: routeHistory
      summary: Event timeline for one exact prefix (unicast).
      parameters:
        - name: prefix
          in: query
          required: true
          schema: { type: string }
        - name: since
          in: query
          description: >
            RFC 3339 timestamp, or a duration relative to now ("1h", "30m",
            "24h"). Default "1h".
          schema: { type: string, default: "1h" }
        - $ref: "#/components/parameters/router"
        - $ref: "#/components/parameters/peer"
        - $ref: "#/components/parameters/rib"
      responses:
        "200":
          description: >
            Raw events, newest first, NOT current-state-deduplicated: history
            is the one surface where withdrawals and superseded announcements
            are the payload, not noise.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/HistoryEvent" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/topology:
    get:
      tags: [routes]
      operationId: findTopology
      summary: The AS-path graph the routes in one scope form.
      description: >
        Takes /v1/routes' scope parameters exactly -- prefix=, covers=,
        router=, peer=, rib=, origin_asn=, through_asn=, community= -- and
        returns the graph those routes form rather than the routes
        themselves. prefix= and covers= stay mutually exclusive with each
        other, for the reason /v1/routes states.

        What it does NOT inherit is that endpoint's sufficiency rule.
        /v1/routes requires one of five CONTENT filters and treats
        router=/peer= as narrowing only; here **router= and peer= together
        are a sufficient scope**, and either half alone is not. The
        difference is the answer's size rather than caprice: one peer's RIB
        is hundreds of thousands of routes and /v1/routes refuses to return
        it, but the same peer's AS-path graph is tens of edges, and
        router_ip/peer_ip are a prefix of every route table's sort key, so
        that mode is a seek where origin_asn= is a scan. A request carrying
        none of the five content filters and not both halves of that pair is
        a 400 naming what would make it answerable; rib= narrows an answer
        but does not make one.

        There is no limit= and no pagination. A graph is tens of edges, and
        capping one would mean choosing which adjacencies to hide -- a
        decision no caller asked for and none could detect from the answer.
        meta.total_matched is reported anyway: it is the route identities the
        scope matched, summed across the three families, which is the
        population the graphs were built from and not a sum over nodes or
        edges. There is no since= either, so the daemon's
        max_unscoped_since never applies here.
      parameters:
        - $ref: "#/components/parameters/prefix"
        - $ref: "#/components/parameters/covers"
        - $ref: "#/components/parameters/router"
        - $ref: "#/components/parameters/peer"
        - $ref: "#/components/parameters/rib"
        - $ref: "#/components/parameters/originASN"
        - $ref: "#/components/parameters/throughASN"
        - $ref: "#/components/parameters/community"
      responses:
        "200":
          description: >
            One merged AS-path graph per family, keyed the way RouteFanout
            keys its three arrays. Four things this answer does not claim,
            each of them a claim the archive cannot support:

            **1. No AS holder names.** A node is an AS NUMBER. This answer
            carries no holder names; GET /v1/asnames resolves them, in one
            batch for the ASNs a client draws, when the optional RIPE
            dataset is loaded. No IRR or whois data is collected.

            **2. A withdrawn route is in the graph, described by its last
            ADVERTISED path.** A BGP withdrawal carries NLRI and no path
            attributes, so the path of a withdrawn route is its newest
            announcement rather than its newest observation. That is why
            origin_asn= and through_asn= match routes an AS has STOPPED
            originating here, where they cannot on /v1/routes -- a deliberate
            divergence in the answer for the identical query string, and the
            question this graph exists to answer.

            **3. A thin edge is not a weak link.** An edge's `routes` is how
            many route identities IN THIS ANSWER traverse that adjacency --
            paths carried, and nothing else. It is not capacity, not
            preference, not stability and not health.

            **4. These are the families' graphs, not one graph.** Merging
            them would assert that an EVPN adjacency and a unicast adjacency
            are the same kind of edge, which no BGP speaker claims; the three
            differ by an order of magnitude in size.

            `routes` and `live_routes` on an edge are carried separately so a
            client can derive the state it draws without a second call:
            `live_routes == 0` means every route carrying that adjacency has
            been withdrawn, `first_seen` inside the window on screen means
            the edge is newly observed, and everything else is stable. A
            server-computed state string would bake that window into the
            response, and the window is a thing the operator moves.

            A family's graph is empty whenever the scope reaches nothing in
            it, which is ordinary rather than exceptional: EVPN's real graph
            is two edges wide, and a one-hop AS path contributes a node and
            no edge at all. nodes and edges are arrays with no null form, so
            an empty one is the positive claim "nothing there", never "we did
            not look".

            **meta.warnings never carries session_dumping on this path, and
            an empty warnings array here is therefore not a claim of
            completeness.** Dump progress is a property of a (peer, family),
            which is the grain /v1/peers reports it at; the merged graph
            carries no dump state at all, and a warning synthesized at this
            layer would be asserting a fact rather than reporting one. The
            consequence is an operator's to know: a peer still sending its
            initial dump yields a PARTIAL graph -- edges that will appear
            once the dump completes are simply absent -- and this response
            does not say so. The same scope on /v1/routes does warn, so the
            looking glass's Paths tab can report a session still loading
            while its Topology tab reports nothing at all. Read /v1/peers
            for the scope's dump state before taking a sparse graph for the
            whole one.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/TopologyFanout" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/events:
    get:
      tags: [events]
      operationId: findPeerEvents
      summary: Session history for one peer, or the newest events fleet-wide -- peer_events as the events they were.
      parameters:
        - $ref: "#/components/parameters/router"
        - $ref: "#/components/parameters/peer"
        - $ref: "#/components/parameters/rib"
        - name: since
          in: query
          description: >
            RFC 3339 timestamp, or a duration relative to now ("1h", "30m",
            "24h"). Default "1h". Bounds against ts_collector, never
            ts_router.
          schema: { type: string, default: "1h" }
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: >
            Two modes on one path, chosen by scope.

            SCOPED -- router AND peer -- is the walk this path has always
            served: one page of one peer's history, newest first,
            keyset-ordered by (ts_collector, stream_seq) descending on the
            collector clock, the trustworthy one -- ts_router is carried
            for display and is never sorted or paged on. Its since= is not
            clamped: scoped, a wide window is still a seek.

            UNSCOPED -- neither router nor peer -- is the fleet console's
            question: the newest events anywhere. It is capped rather than
            paginated, so meta.next_cursor is always null and
            meta.total_matched carries the true match count, with a
            "truncated" warning when the cap applied -- the same pair
            /v1/ls/nodes uses, so a request never receives a cursor it
            could not legally resend alongside its own filter. cursor= on
            an unscoped request is a 400.

            Capped at limit= -- default 1000, clamped to the daemon's
            max_page as a ceiling, same as every other paginated path here
            -- not at max_page directly: this mode still honors an explicit
            limit= below that ceiling.

            An unscoped since= is bounded at both ends: absent it defaults
            to 1h, and wider than the daemon's max_unscoped_since (24h by
            default) it is a 400 that names the limit. That clamp applies
            to the unscoped mode only -- scoped, this same window is still
            not clamped, because there a wide window is a seek rather than
            the full-table read it is when nothing narrows the walk.

            Naming exactly one half of the scope -- router without peer, or
            peer without router -- is a 400 rather than either mode. It is
            neither a scoped walk nor a fleet-wide question, and answering
            it as the latter would hand an operator who forgot a parameter
            a different question's answer.

            Unlike /v1/rib/* and the three /v1/ls paths, this walk -- in
            either mode -- is not pinned to one BMP session: a peer's event
            history is itself the record of sessions starting and ending,
            and a session pin would stop the walk at the very transitions
            this endpoint exists to show. The scoped cursor carries no
            session, and paginating it never answers 409.

            peer_events keeps the configured history retention (90 days by
            default; a TTL on ts_collector, reported as meta.retention_days
            on GET /v1/collectors); a session's events are deleted, not
            merely unindexed, once they age past it. An empty answer for an old since= does not
            distinguish "nothing happened" from "it happened and was
            purged."
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/PeerEvent" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/rib/unicast:
    get:
      tags: [rib]
      operationId: ribUnicast
      summary: Paginated current unicast RIB for one (router, peer).
      parameters:
        - $ref: "#/components/parameters/routerRequired"
        - $ref: "#/components/parameters/peerRequired"
        - $ref: "#/components/parameters/rib"
        - $ref: "#/components/parameters/ribCollector"
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: >
            One page, keyset-ordered by (rib, prefix, path_id). rib is part
            of the page key, not merely a filter: the same (prefix, path_id)
            legitimately appears under in_pre, in_post and loc_rib for one
            peer -- verified in the live archive -- so a key without it would
            silently drop routes at page boundaries. Including it also
            matches the table's own sort order, which leads with
            (router_ip, peer_ip, rib). The walk is pinned to the session
            observed at page 1; the page set is a smear over a live table,
            not a snapshot -- meta.warnings says so on every page.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/UnicastRoute" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/SessionChanged" }

