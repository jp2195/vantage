  /v1/ls/nodes:
    get:
      tags: [link-state]
      operationId: findLSNodes
      summary: Link-state nodes, one row per observing router and peer.
      parameters:
        - $ref: "#/components/parameters/router"
        - $ref: "#/components/parameters/peer"
        - $ref: "#/components/parameters/rib"
        - $ref: "#/components/parameters/protocol"
        - $ref: "#/components/parameters/area"
        - $ref: "#/components/parameters/lsASN"
        - $ref: "#/components/parameters/node"
        - $ref: "#/components/parameters/lsState"
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: >
            No narrowing parameter is required, unlike /v1/routes: the whole
            fleet's topology is a small answer. One row per (observer,
            node) -- the same node reported by six routers is six rows, and
            node_key is how a caller groups them. A request naming both
            router= and peer=, and no node-identity narrowing (protocol=,
            area=, asn=, node=, or a non-default state=), is scoped and may
            be paginated with cursor=; it is capped at max_page when no
            limit= is given, not at the smaller default page every other
            paginated path takes. An unscoped request, or a scoped one that
            also narrows by node identity, stays capped at the daemon's
            max_page instead -- with meta.total_matched carrying the true
            count and meta.next_cursor always null -- so a request never
            receives a cursor it could not legally resend alongside its own
            filter.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/LSNode" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/SessionChanged" }

  /v1/ls/links:
