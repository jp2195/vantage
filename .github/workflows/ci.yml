# CI: build/test/vet/format, generated-code freshness, and a proto
# backward-compatibility gate (package vantage.v1 is additive-only, enforced
# by buf breaking).
#
# Tool versions are pinned to exactly what the Makefile documents
# (buf@v1.73.0, protoc-gen-go@v1.36.12) so CI's codegen/breaking-check output
# can never silently drift from what a contributor's local `make generate`
# produces.
#
# The token is read-only, and no checkout persists it: every job runs code
# the change under test controls (npm ci, go install, make generate), and
# none of it needs to talk to GitHub. Actions are pinned by commit SHA and
# the ClickHouse service image by digest, so a moved tag cannot change what
# runs here.
name: CI

# Pushes to main, and pull requests. A same-repository branch with a pull
# request open would otherwise run twice, once per event.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same pull request makes the older run's result
# irrelevant, so it is canceled. Pushes to main are never canceled: each one
# is the buf-breaking baseline for the next, and its result is the record of
# what main was.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # ClickHouse for sink's live tests (see chtest.DSN, dialed via
    # chtest.Require in clickhouse_test.go's requireClickHouse) and for the
    # corpus-replay end-to-end test, which needs the same server. Port 9000 is the
    # native protocol, matching docker-compose.dev.yml's dev stack, so the
    # exact same DSN (clickhouse://vantage:vantage@127.0.0.1:9000/vantage_test)
    # reaches a real ClickHouse in both a dev checkout and here. The health
    # check (a real query, not just a TCP connect) is what setup-go/checkout
    # ordering can't guarantee on its own: service containers start in
    # parallel with the job's own container, so without it the schema-apply
    # step below could run before the server accepts connections.
    services:
      clickhouse:
        # clickhouse/clickhouse-server:26.8.7.19-alpine (multi-platform index)
        image: clickhouse/clickhouse-server@sha256:2bece7c646f08865eadc2000a60427e2964adf2b46908a6d476dfa7cc5408720
        ports:
          - 9000:9000
        env:
          CLICKHOUSE_DB: vantage
          CLICKHOUSE_USER: vantage
          CLICKHOUSE_PASSWORD: vantage
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, not the default shallow single-ref checkout: the
          # buf-breaking step below diffs the proto module against another
          # commit (the base branch, or the previous commit on main), which
          # must be available locally. With fetch-depth 0, checkout fetches
          # every branch into refs/remotes/origin/*, so origin/main is
          # already here and that step needs no credentials of its own.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Matches go.mod's `toolchain go1.27.1` line exactly -- not its
          # `go 1.27.0` line, which is the LANGUAGE version floor rather
          # than the toolchain a build runs on. The two differ now: the go
          # directive says what the source may use, the toolchain directive
          # says what compiles it, and this pin has to track the second or
          # it is pinning nothing.
          #
          # Leaving this behind go.mod would not fail the build --
          # GOTOOLCHAIN defaults to "auto", so go itself would silently
          # download whatever the toolchain directive names -- it would
          # just mean this pin is decorative and the toolchain actually
          # used drifts unpinned between runs. Which is the whole reason
          # it is written down.
          go-version: "1.27.1"

      - name: go build
        run: go build ./...

      # The public repository is built without scripts/internal-paths.txt's
      # directories and without this history, so a published file must not
      # point at either. A full clone is needed to resolve cited SHAs.
      - name: published files stand alone
        run: make standalone-check

      - name: apply clickhouse schema
        env:
          # The service's own container; its image is pinned by digest, so a
          # lookup by image tag finds nothing.
          CLICKHOUSE_CONTAINER: ${{ job.services.clickhouse.id }}
        run: |
          # The clickhouse service above starts before this job's steps
          # (including checkout), so deploy/clickhouse/schema.sql can't be
          # bind-mounted into it the way docker-compose.dev.yml mounts it at
          # /docker-entrypoint-initdb.d -- that file doesn't exist on the
          # runner yet at service-start time. Apply it explicitly instead,
          # now that checkout has put the file on disk and the health check
          # above has confirmed the server is answering queries.
          #
          # The tests no longer read this database: sink's live
          # tests create and own a `vantage_test` database of their own
          # (chtest's ensureDatabase, reached through chtest.Require in
          # clickhouse_test.go's requireClickHouse), so that replaying the
          # vendor corpus cannot collide with a real archive. This step
          # stays because it is the only place CI exercises the DDL the way
          # the dev stack actually applies it -- one clickhouse-client
          # --multiquery invocation over the whole file -- which is a
          # different path from the statement-at-a-time one the tests use,
          # and the one an operator will hit first.
          #
          # This goes through clickhouse-client inside the container (via
          # docker exec), not curl against the HTTP port: ClickHouse's HTTP
          # interface rejects a semicolon-separated multi-statement body
          # outright ("Multi-statements are not allowed"), confirmed against
          # the dev container while writing this step, whereas
          # clickhouse-client --multiquery runs the whole DDL script as one
          # invocation, which is what docker-compose.dev.yml's
          # initdb.d mount relies on the server doing for it locally.
          docker exec -i "$CLICKHOUSE_CONTAINER" clickhouse-client -u vantage --password vantage --multiquery < deploy/clickhouse/schema.sql

      # sink's TestSchemaJobRetentionStepIsIdempotent renders the chart's
      # schema Job and runs its retention step in the Job's own image
      # (docker is on the runner), so this job needs helm and the chart's
      # dependencies as well.
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      # helm dependency build resolves Chart.lock's repository by URL, and
      # only among repositories added to this helm client.
      - run: helm repo add nats https://nats-io.github.io/k8s/helm/charts/ && helm dependency build deploy/helm/vantage

      # -race, not a plain run. Several tests in this repo only discriminate
      # under the detector -- natsutil's TestPublisherConcurrentPublishAndDrain
      # says so in its own doc comment, because the sync.WaitGroup version it
      # guards against passes most runs without it. That defect was a
      # reproducible process panic on the daemon's first concurrent flush, so
      # it is exactly what CI must not let back in. The whole suite runs in a
      # few seconds under -race, so there is no reason to split it.
      - name: go test -race
        # VANTAGE_REQUIRE_CLICKHOUSE turns sink's (and query's) live-ClickHouse
        # tests from "skip if unreachable" into "fail if unreachable" (see
        # chtest's requireEnv gate, documented on chtest.Skip). Set here,
        # and only here: a CI run must never pass by silently skipping the
        # one test suite that catches an Append argument landing in the
        # wrong column, which is a failure this suite exists to catch,
        # while a developer without the dev stack running still gets a
        # usable `go test ./...` locally.
        env:
          VANTAGE_REQUIRE_CLICKHOUSE: "1"
        run: go test -race ./...

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt would reformat the following files:"
            echo "$out"
            exit 1
          fi

      - name: install pinned buf/protoc-gen-go
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.73.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: generated code is up to date
        run: |
          make generate
          if ! git diff --exit-code -- schema; then
            echo "schema is stale: run 'make generate' and commit the result."
            exit 1
          fi

      # The proto module is additive-only: a change that would break a
      # client built against the previous schema fails here. A pull request
      # is compared with the branch it targets, and a push to main with the
      # commit main pointed at before the push, so a change that reaches
      # main without a pull request is still checked. When that commit is
      # not in the history (a force push replaced it), the previous commit,
      # HEAD~1, stands in. The comparison ref must contain the proto module:
      # buf fails on an empty one rather than passing.
      - name: buf breaking
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then
            against="origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            against="$BEFORE"
          else
            against="HEAD~1"
          fi
          against=$(git rev-parse --verify "$against^{commit}")
          echo "buf breaking against $against"
          buf breaking --against ".git#ref=$against"

      # `go build ./...` above proves the SOURCE compiles with the toolchain
      # this workflow pins. It says nothing about the toolchain the images
      # are built with, which is pinned separately in each Dockerfile's FROM
      # line -- and that gap has already cost us: go.mod moved to 1.25.0
      # while both Dockerfiles still said golang:1.24, so every binary in
      # the dev stack failed to build while CI stayed green. Nothing here
      # ran docker build, so nothing noticed until the stack was brought up
      # by hand.
      #
      # This step closes that specific class: a Dockerfile whose base image,
      # build steps or COPY paths no longer match the repo. It is last
      # because it is the slowest gate in the job, and a source-level break
      # should surface from the seconds-long steps above rather than from
      # here.
      #
      # No registry, no push, no cache: the artifact is not wanted, only the
      # exit status. All three images are built because they pin their
      # toolchains independently and have drifted independently before.
      # Dockerfile.api joined this list when it grew a second, independently
      # pinned toolchain of its own (node:24 alongside golang:1.25) plus a
      # COPY --from=ui path between stages -- exactly the shape of drift this
      # step exists to catch, and unguarded until now.
      - name: docker build (image toolchain pins, not just source)
        run: |
          docker build -f Dockerfile.collector -t vantage-collector:ci .
          docker build -f Dockerfile.writer -t vantage-writer:ci .
          docker build -f Dockerfile.api -t vantage-api:ci .

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      # vue-tsc --noEmit, then the production build. It also proves
      # webui/dist/.gitkeep survives emptyOutDir -- see the ui/public/.gitkeep
      # step below.
      - run: npm run build
      # Nothing else in this workflow notices an empty build. This job never
      # builds Go, the `ci` job builds Go with no Node (so it embeds an empty
      # webui/dist on purpose), and the docker build step proves only that
      # Dockerfile.api's COPY --from=ui resolves a path -- not that the path
      # had an app in it. A build that emitted assets/ and no index.html would
      # pass every one of those and ship a daemon whose every page is
      # webui/webui.go's 503 "run `make ui`". This is the one line that reads
      # the output the Go binary actually embeds.
      - name: the build produced an app for the Go binary to embed
        run: test -f ../webui/dist/index.html
      - run: npm test
      # emptyOutDir wipes webui/dist before every build, .gitkeep included;
      # ui/public/.gitkeep is what Vite copies back in afterward (publicDir
      # is copied into outDir AFTER it is emptied). If that ever stops
      # working -- a Vite upgrade that skips dotfiles, someone deleting
      # ui/public/.gitkeep -- this is what catches it: webui/dist/.gitkeep
      # is committed and load-bearing (see webui/webui.go's package doc),
      # and a build that fails to restore it would otherwise only show up
      # as a dirty git status nobody happened to run.
      - name: webui/dist/.gitkeep survived the build
        run: |
          if ! git diff --exit-code -- ../webui/dist; then
            echo "the build changed webui/dist/.gitkeep -- see ui/public/.gitkeep and vite.config.ts's build.emptyOutDir"
            exit 1
          fi
      # The same property the buf check gives the protobuf code: the
      # committed client is the contract's client. Without this, editing
      # api/openapi.yaml and forgetting to regenerate leaves the UI typed
      # against endpoints the daemon no longer serves, and nothing notices
      # until a blank cell in production.
      - name: generated client is up to date
        run: |
          npm run generate
          if ! git diff --exit-code -- src/api/generated; then
            echo "ui/src/api/generated is stale -- run 'make ui-gen' and commit the result"
            exit 1
          fi

  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # NATS mutual TLS is on by default and the chart never mints keys, so a
    # render with no certificate configuration fails by design. Steps that
    # test something else supply stand-in client Secret names (TLS_CERTS);
    # steps about the plaintext opt-out use PLAINTEXT, which must turn off
    # both the client side and the bundled server's three TLS switches
    # (client-facing, the CA bundle, and the cluster routes).
    env:
      TLS_CERTS: --set nats.tls.collectorSecret=c-tls --set nats.tls.writerSecret=w-tls
      PLAINTEXT: --set nats.tls.enabled=false --set nats.tlsCA.enabled=false --set nats.config.nats.tls.enabled=false --set nats.config.cluster.tls.enabled=false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The chart supports Helm 3 and Helm 4, so every chart check runs
      # under both, in this one job (.github/actions/helm-chart-checks). A
      # matrix would rename the check, and branch protection requires it by
      # the exact name `helm`.
      #
      # `./`, not the self-repository form `$/`, which zizmor prefers:
      # actionlint 1.7.12 rejects `$/` (rhysd/actionlint#732).
      - name: chart checks on Helm 3
        uses: ./.github/actions/helm-chart-checks # zizmor: ignore[self-repository]
        with:
          helm-version: v3.22.0
      - name: chart checks on Helm 4
        uses: ./.github/actions/helm-chart-checks # zizmor: ignore[self-repository]
        with:
          helm-version: v4.3.0
