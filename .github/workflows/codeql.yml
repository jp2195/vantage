# CodeQL: static analysis of the Go module, the TypeScript and JavaScript
# in ui/, and the workflows themselves.
#
# Go is built by hand with `go build ./...`, so the extractor sees every
# package in the module: the daemons and the CLI under cmd/, and api, query,
# sink, collector, bmp, bgp and the rest. TypeScript, JavaScript and Actions
# need no build.
#
# Code scanning is free on public repositories and needs GitHub Advanced
# Security on private ones. The `visibility` job reads the repository's
# visibility through the API, which works for every trigger here, and the
# analysis is skipped on a private repository instead of failing.
# (`github.event.repository` is not part of every event's payload.)
#
# Actions are pinned by commit SHA.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, Monday 07:27 UTC, off the hour.
    - cron: "27 7 * * 1"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  visibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Repository metadata is readable with no granted permission.
    permissions: {}
    outputs:
      public: ${{ steps.check.outputs.public }}
    steps:
      - name: is this repository public
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          private=$(gh api "repos/$GH_REPO" --jq .private)
          echo "private=$private"
          if [ "$private" = false ]; then
            echo "public=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CodeQL skipped: code scanning on a private repository needs GitHub Advanced Security."
            echo "public=false" >> "$GITHUB_OUTPUT"
          fi

  # Not on pull requests from forks: the job holds security-events: write,
  # and a fork's pull request is analyzed once it merges, by the push to
  # main. Same-repository pull requests and pushes to main are analyzed.
  analyze:
    needs: visibility
    if: >-
      needs.visibility.outputs.public == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write  # upload the results to code scanning
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - if: matrix.language == 'go'
        name: go build
        run: go build ./...
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
